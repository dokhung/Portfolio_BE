name: webportfolio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?backendの.envにPOSTGRES_DBを設定してください}
      POSTGRES_USER: ${POSTGRES_USER:?backendの.envにPOSTGRES_USERを設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?backendの.envにPOSTGRES_PASSWORDを設定してください}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?backendの.envにPOSTGRES_PORTを設定してください}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    profiles: ["backend"]
    build:
      context: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      BACKEND_PORT: 8080
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?backendの.envにPOSTGRES_DBを設定してください}
      POSTGRES_USER: ${POSTGRES_USER:?backendの.envにPOSTGRES_USERを設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?backendの.envにPOSTGRES_PASSWORDを設定してください}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?backendの.envにCORS_ALLOWED_ORIGINSを設定してください}
    ports:
      - "127.0.0.1:${BACKEND_PORT:?backendの.envにBACKEND_PORTを設定してください}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
